{% block title %}Login — InNovaIdeia{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="auth-card animate-fadeInScale">
        <div class="text-center mb-4">
            <div class="btn-icon mx-auto mb-3" style="background: var(--neon-blue-soft); color: var(--neon-blue); width: 56px; height: 56px; font-size: var(--text-xl);">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <h2 class="auth-title">Bem-vindo de volta</h2>
            <p class="auth-subtitle">Faça login para acessar o dashboard</p>
        </div>

        <form method="POST" id="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label">
                    <i class="fa-solid fa-user me-1" style="color: var(--neon-blue);"></i> Usuário
                </label>
                <input type="text" name="username" class="form-control-neon" placeholder="Digite seu usuário" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fa-solid fa-lock me-1" style="color: var(--neon-blue);"></i> Senha
                </label>
                <div class="position-relative">
                    <input type="password" name="password" class="form-control-neon" id="login-password" placeholder="Digite sua senha" required>
                    <button type="button" class="btn btn-ghost btn-sm position-absolute" style="right: 8px; top: 50%; transform: translateY(-50%); padding: 4px 8px;" onclick="togglePassword('login-password', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block mt-4" id="login-submit">
                <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Entrar
            </button>
        </form>

        <div class="text-center mt-4" style="border-top: 1px solid var(--border-subtle); padding-top: var(--space-4);">
            <p class="m-0" style="color: var(--text-muted); font-size: var(--text-sm);">
                Não tem conta?
                <a href="/register" class="fw-bold">Cadastre-se</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('login-form');
    const btn = document.getElementById('login-submit');
    if (form && btn) {
        form.addEventListener('submit', () => {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Entrando...';
        });
    }
});
</script>
{% endblock %}
