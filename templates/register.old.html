{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center">
    <div class="bg-gray-900 p-8 rounded-2xl shadow-xl w-full max-w-md">

        <h2 class="text-2xl font-bold text-center mb-6">Cadastro</h2>

        <form method="POST" class="space-y-4">
            <input type="text" name="username" placeholder="Usuário"
                class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700">

            <input type="password" name="password" placeholder="Senha"
                class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700">

            <button class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded-lg">
                Cadastrar
            </button>
        </form>

        <p class="text-center text-gray-400 mt-4">
            Já tem conta? <a href="/login" class="text-blue-400">Login</a>
        </p>

    </div>
</div>

{% endblock %}
