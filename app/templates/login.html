{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="flex-center" style="min-height: 100vh;">
    <div class="card elevated" style="max-width: 400px; width: 100%;">
        <h2 class="heading-2 text-center mb-lg">Login</h2>
        <form method="POST" class="grid gap-md">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="username" class="form-control" placeholder="Usuário" required>
            <input type="password" name="password" class="form-control" placeholder="Senha" required>
            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>
        <p class="text-center text-sm mt-md">
            Não tem conta? <a href="/register">Cadastre-se</a>
        </p>
    </div>
</div>
{% endblock %}
