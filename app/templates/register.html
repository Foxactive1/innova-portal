{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<div class="flex-center" style="min-height: 100vh;">
    <div class="card elevated" style="max-width: 400px; width: 100%;">
        <h2 class="heading-2 text-center mb-lg">Cadastro</h2>
        <form id="register-form" method="POST" class="grid gap-md">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="username" class="form-control" placeholder="Usuário" required>
            
            <div class="form-group">
                <input type="password" id="register-password" name="password" class="form-control" placeholder="Senha" required>
                <div class="progress mt-sm">
                    <div id="password-meter-fill" class="progress-bar" style="width: 0%;"></div>
                </div>
                <span id="password-meter-label" class="form-help text-xs"></span>
            </div>
            
            <div class="form-group">
                <input type="password" id="register-password-confirm" name="password_confirm" class="form-control" placeholder="Confirme a senha" required>
                <span id="password-match-status" class="form-help text-xs"></span>
            </div>
            
            <button type="submit" id="register-submit" class="btn btn-primary btn-block">Cadastrar</button>
        </form>
        <p class="text-center text-sm mt-md">
            Registrado? <a href="/login">Fazer login</a>
        </p>
    </div>
</div>
<script src="/static/register.js"></script>
{% endblock %}
